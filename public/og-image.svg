<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1E0F45"/>
  <!-- Subtle gradient overlay -->
  <rect width="1200" height="630" fill="url(#grad)" opacity="0.6"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1B69;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A0D3D;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Compass icon large, centered left -->
  <g transform="translate(160,315)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#F4A23A" stroke-width="2"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#F4A23A" stroke-width="0.8" opacity="0.4"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#F4A23A" stroke-width="1.5"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#F4A23A" stroke-width="1.5"/>
    <line x1="-64" y1="-64" x2="64" y2="64" stroke="#F4A23A" stroke-width="1"/>
    <line x1="64" y1="-64" x2="-64" y2="64" stroke="#F4A23A" stroke-width="1"/>
    <circle cx="0" cy="0" r="12" fill="#F7C05A"/>
    <polygon points="0,-91 7,-70 0,-55 -7,-70" fill="#F4A23A"/>
    <polygon points="0,55 7,70 0,91 -7,70" fill="#F4A23A"/>
    <polygon points="-91,0 -70,-7 -55,0 -70,7" fill="#F4A23A"/>
    <polygon points="55,0 70,-7 91,0 70,7" fill="#F4A23A"/>
  </g>

  <!-- Divider line -->
  <line x1="300" y1="180" x2="300" y2="450" stroke="#F4A23A" stroke-width="0.5" opacity="0.4"/>

  <!-- Text block -->
  <text x="360" y="250" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="8" fill="#F7C05A">FAB</text>
  <text x="360" y="320" font-family="Georgia, serif" font-size="48" font-weight="300" letter-spacing="6" fill="#FDF6EC">VACAY VIBES</text>
  <line x1="360" y1="345" x2="1050" y2="345" stroke="#F4A23A" stroke-width="1" opacity="0.4"/>
  <text x="360" y="380" font-family="Georgia, serif" font-size="22" letter-spacing="6" fill="#F4A23A">LUXURY VACATION RENTALS</text>

  <!-- Three property dots -->
  <text x="360" y="440" font-family="Georgia, serif" font-size="18" letter-spacing="3" fill="#FDF6EC" opacity="0.7">Beach · Desert · Mountain</text>
  <text x="360" y="475" font-family="Georgia, serif" font-size="16" letter-spacing="2" fill="#F4A23A" opacity="0.6">Clearwater · Joshua Tree · Oakhurst</text>

  <!-- Bottom tagline -->
  <text x="360" y="530" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#FDF6EC" opacity="0.5">Book Direct · Save Up to 15% · Personal Service</text>
</svg>
